# Récupération de l'ordre d'achat des items (voir docs/data-pipeline-plan.md,
# phase 2).
#
# Passe SÉPARÉE du crawl principal, et c'est le point de conception : un
# timeline pèse 1,48 Mo contre 138 Ko pour un match et coûte un appel de plus.
# Le mêler à l'ingestion diviserait par deux la couverture en matchs — or la
# couverture prime, l'ordre d'achat converge vite.
#
# Ce job traite les matchs les plus récents d'abord : ce sont eux qui comptent
# pour la méta du patch courant.
#
# ⚠️ Le dimensionnement est une SOUSTRACTION, pas un réglage libre. Une passe de
# crawl crée 120 matchs à timeliner ; une passe de timeline en absorbe 80. À
# nombre de passes égal le retard se creuse mécaniquement — constaté le
# 2026-09-14, où il est passé de 1 007 à 1 367 en une matinée pendant que le
# crawler avançait.
#
# Porté de 2 à 14 passes le 2026-09-14 pour le combler : 14 × 80 = 1 120
# timelines par job, contre 10 × 120 = 1 200 matchs créés par un job de crawl.
# Les deux se répondent enfin, et le retard accumulé se résorbe à chaque
# déclenchement qui ne tombe pas juste après un crawl.
#
# Les deux jobs partagent le même groupe de concurrence (voir plus bas) : ils
# ne tournent jamais ensemble, ils se relaient.
name: Fetch item purchase order

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      maxMatches:
        description: "Plafond de matchs par passe"
        required: false
        default: "80"
      passes:
        description: "Nombre de passes enchaînées dans ce job"
        required: false
        default: "14"

# Un SEUL job à la fois touche la clé Riot.
#
# Le crawl et les timelines avaient chacun leur groupe, donc ils pouvaient
# tourner en même temps — sans conséquence tant qu'un job durait 10 min, mais le
# crawl en dure maintenant ~47. Deux jobs simultanés se disputent le même budget
# (100 appels / 2 min, attaché à la clé) et, comme le limiteur vit en mémoire de
# chaque instance Vercel, aucun des deux ne voit ce que l'autre dépense : ils
# partent tous deux en 429 et écrasent les recherches de visiteurs au passage.
#
# Groupe commun = le second attend la fin du premier. Le débit total ne change
# pas (il est borné par la clé, pas par le nombre de jobs), mais il est dépensé
# proprement, et le site garde des fenêtres propres entre deux jobs.
concurrency:
  group: riot-api
  cancel-in-progress: false

jobs:
  timelines:
    runs-on: ubuntu-latest
    # 14 passes × (~130 s de travail + 150 s de pause) ≈ 65 min. La limite dure
    # de GitHub est de 6 h ; la marge couvre les passes lentes.
    timeout-minutes: 120
    steps:
      - name: Récupérer les ordres d'achat
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MAX_MATCHES: ${{ inputs.maxMatches || '80' }}
          PASSES: ${{ inputs.passes || '14' }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Secrets SITE_URL et CRON_SECRET requis."
            exit 1
          fi

          failures=0
          remaining="?"

          for i in $(seq 1 "${PASSES}"); do
            echo "── passe ${i}/${PASSES} ──"

            http_code=$(curl --silent --show-error \
              --max-time 290 \
              --request POST \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              --output /tmp/timeline-response.json \
              --write-out "%{http_code}" \
              "${SITE_URL%/}/api/cron/timelines?maxMatches=${MAX_MATCHES}&maxDurationMs=230000") || true

            response=$(cat /tmp/timeline-response.json 2>/dev/null || true)
            echo "HTTP ${http_code}"
            echo "$response"

            # Une passe qui échoue ne tue pas le job : l'état vit en base
            # (matches.timeline_fetched_at), la suivante reprend où on en est.
            if [ "$http_code" != "200" ]; then
              echo "::warning::Passe ${i} échouée (HTTP ${http_code}) : ${response}"
              failures=$((failures + 1))
              if [ "$i" -lt "${PASSES}" ]; then sleep 30; fi
              continue
            fi

            if echo "$response" | grep -q '"stoppedBy":"apiUnavailable"'; then
              echo "::warning::Clé Riot refusée — régénérer la clé de dev (expire toutes les 24 h), la mettre sur Vercel et redéployer."
              exit 0
            fi

            remaining=$(echo "$response" | sed -n 's/.*"remaining":\([0-9-]*\).*/\1/p')

            # Rendre la main au site entre deux passes : pendant une passe le
            # budget de débit est saturé et une recherche de visiteur échoue.
            if [ "$i" -lt "${PASSES}" ]; then
              echo "pause de 150 s (le site retrouve du budget)"
              sleep 150
            fi
          done

          echo "::notice::${remaining} timelines restants (${failures} passe(s) en échec)."

          if [ "$failures" -ge "${PASSES}" ]; then
            echo "::error::Les ${PASSES} passes ont échoué."
            exit 1
          fi
