# Recalcule les snapshots de stats (voir docs/data-pipeline-plan.md, phase 0).
#
# Pourquoi ici et pas sur Vercel : le calcul y tournait en fonctions (ce job
# faisait des `curl` vers /api/cron/refresh-stats) jusqu'au blocage du compte
# Hobby pour usage excessif, le 2026-10-02. Depuis le 2026-10-05 le runner
# exécute lui-même scripts/jobs.ts : gratuit et illimité sur un dépôt public,
# et sans le plafond de 300 s par appel — la publication seule en prenait 292
# le jour de la migration.
#
# C'est la SEULE publication complète : le moteur ne publie plus que les
# compteurs de l'accueil.
#
# ⚠️ Sur un repo public, GitHub désactive les workflows planifiés après
# 60 jours sans activité sur le repo ; il faut alors les réactiver à la main.
name: Refresh stats snapshots

on:
  schedule:
    # Toutes les heures. L'intervalle minimum autorisé par GitHub est 5 min, et
    # la planification peut être retardée en période de charge — sans gravité
    # ici, les stats n'ont pas besoin d'être à la minute.
    # Depuis le 2026-09-28, pg_cron (Supabase) déclenche ce workflow à :17 par
    # workflow_dispatch ; ce cron-ci reste en filet.
    - cron: "17 * * * *"
  workflow_dispatch: # déclenchement manuel depuis l'onglet Actions

# Un seul rafraîchissement à la fois : deux jobs concurrents feraient le même
# calcul et se marcheraient dessus à l'écriture.
concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Classement ~1 min, matérialisation ~1 min, publication ~5 min (05/10).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # `npm install` et non `npm ci` : le lock, généré sur macOS, ne liste pas
      # certains paquets optionnels propres à Linux, et `npm ci` refuse alors.
      - run: npm install --no-audit --no-fund
      # Classement → matérialisation → snapshots, sous le bail de publication
      # (voir scripts/jobs.ts). Rouge si la publication elle-même échoue.
      - name: Recalculer et publier
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/jobs.ts publish
