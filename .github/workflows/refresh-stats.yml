# Recalcule les snapshots de stats (voir docs/data-pipeline-plan.md, phase 0).
#
# Pourquoi ici et pas dans un cron Vercel : le plan Hobby limite les crons à
# **une fois par jour**, ce qui est trop peu. GitHub Actions est gratuit et
# illimité en minutes sur un repo public (2 000 min/mois en privé, et ce job
# consomme quelques secondes). C'est aussi là que tournera le crawler en
# phase 1 — autant n'avoir qu'un seul endroit qui déclenche les jobs.
#
# ⚠️ Sur un repo public, GitHub désactive les workflows planifiés après
# 60 jours sans activité sur le repo ; il faut alors les réactiver à la main.
name: Refresh stats snapshots

on:
  schedule:
    # Toutes les heures. L'intervalle minimum autorisé par GitHub est 5 min, et
    # la planification peut être retardée en période de charge — sans gravité
    # ici, les stats n'ont pas besoin d'être à la minute.
    - cron: "17 * * * *"
  workflow_dispatch: # déclenchement manuel depuis l'onglet Actions

# Un seul rafraîchissement à la fois : deux jobs concurrents feraient le même
# calcul et se marcheraient dessus à l'écriture.
concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Déclencher le recalcul
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Secrets SITE_URL et CRON_SECRET requis (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          # DEUX APPELS, PAS UN.
          #
          # Le recalcul faisait deux métiers dans une seule fonction de 300 s :
          # le classement (MMR rejoué sur toute l'histoire, promotions,
          # compteurs) puis la publication (matérialisation, agrégations,
          # snapshots). Relevé du 2026-09-22, disque déjà desserré : mmr 96 s,
          # promote 167 s, et le délai tombait avant la matérialisation (~92 s)
          # et les agrégations (~150 s).
          #
          # Les deux ne se parlent qu'en un point — la publication fige le
          # `skill_bucket` que le classement vient d'écrire — donc l'ordre
          # compte, mais pas la simultanéité : l'état vit en base entre les deux.
          # Séparés, chacun a ses propres 300 s.
          #
          # Le corps est capturé AVANT de juger du statut : avec `set -e` et
          # --fail-with-body, curl sortirait en erreur et l'affichage du corps
          # ne serait jamais atteint — on perdrait le message d'erreur, qui est
          # précisément ce qu'on veut lire dans les logs.
          phase() {
            local only="$1" code
            code=$(curl --silent --show-error \
              --max-time 300 \
              --request POST \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              --output "/tmp/refresh-${only}.json" \
              --write-out "%{http_code}" \
              "${SITE_URL%/}/api/cron/refresh-stats?only=${only}") || true
            local body
            body=$(cat "/tmp/refresh-${only}.json" 2>/dev/null || true)
            echo "── ${only} — HTTP ${code}"
            echo "$body"
            [ "$code" = "200" ] || return 1
            return 0
          }

          # Le classement d'abord : la publication lit ce qu'il écrit.
          if ! phase ratings; then
            echo "::error::Le recalcul du classement a échoué."
            exit 1
          fi

          if ! phase snapshots; then
            echo "::error::La publication a échoué."
            exit 1
          fi

          response=$(cat /tmp/refresh-snapshots.json 2>/dev/null || true)

          # Le job doit échouer visiblement si l'agrégation a tourné sur une
          # lecture tronquée : les stats publiées seraient partielles sans que
          # rien ne le signale (c'est exactement le bug qu'on vient de corriger).
          if echo "$response" | grep -q '"truncated":true'; then
            echo "::error::Snapshots calculés sur une lecture tronquée — l'agrégation doit passer en SQL (phase 3 du plan)."
            exit 1
          fi
