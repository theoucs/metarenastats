# Moteur Arena — remplace crawl.yml et timelines.yml (voir docs/data-pipeline-plan.md).
#
# ─── POURQUOI UN JOB LONG ET LENT ────────────────────────────────────────────
#
# Diagnostic du 2026-09-14, mesuré et non supposé. Sur 23 h, 12 runs planifiés
# seulement, et surtout : les deux workflows partaient PAR PAIRES (14:26/15:03,
# 18:14/18:20, 20:56/21:07, 23:11/23:31, 01:10/01:40, 06:22/07:07) alors que
# leurs crons étaient à 26 min d'écart. GitHub n'évalue donc pas nos crons un par
# un — il évalue le dépôt, toutes les 2 à 6 h. Éliminés au passage : minutes
# épuisées (dépôt public, illimité), panne GitHub (Actions opérationnel),
# workflows désactivés (les trois `active`), mauvaise branche, et la bascule vers
# les crons Vercel (Hobby = 1×/jour, le déploiement échoue au-delà).
#
# Rien de tout ça ne se règle depuis le dépôt. Donc on ne dépend plus de la
# fréquence des déclenchements : UN déclenchement fait des heures de travail.
#
# Et ce changement de forme corrige une erreur de conception plus ancienne. On
# avait construit à l'envers : des passes courtes et violentes (clé Riot saturée
# à ~50 %), déclenchées rarement. Or le temps de runner est GRATUIT et illimité
# sur un dépôt public, tandis que la clé Riot (100 appels / 2 min, partagée avec
# les visiteurs qui cherchent leur pseudo) est la seule ressource rare.
#
# La bonne forme est donc l'inverse : tourner longtemps, doucement.
#
#   Par cycle : 1 passe de crawl (151 appels) + 2 passes de timeline (2 × 81)
#               = 313 appels, étalés sur ~20 min de cycle
#   Soit ~0,25 appel/s contre 0,83 autorisé → ON UTILISE UN QUART DE LA CLÉ.
#
#   2026-09-28 : DEUX passes de crawl par cycle. Depuis que la découverte est
#   bornée au patch courant et les timelines aux patchs publiés, une passe ne
#   coûte plus que ~80 appels (30 historiques + ~50 matchs, mesuré), et ses
#   timelines ~50. Deux passes ≈ 160 + ~100 = ~260 appels : sous les 313 d'avant,
#   donc la même part de la clé laissée aux visiteurs, pour deux fois plus de
#   matchs du patch courant.
#
# Les trois quarts restants appartiennent en permanence aux visiteurs. C'est
# strictement mieux qu'avant sur les DEUX tableaux : plus de matchs par jour, et
# davantage de marge à chaque instant.
#
# ─── POURQUOI LES DEUX TÂCHES DANS LE MÊME JOB ───────────────────────────────
#
# Elles puisent dans la même clé. Séparées, soit elles se chevauchent et se
# volent du budget sans le savoir (le limiteur vit en mémoire de chaque instance
# Vercel, aucune des deux ne voit ce que l'autre dépense), soit un groupe de
# concurrence commun fait attendre l'une pendant des heures. Alternées dans un
# même cycle, le problème n'existe plus.
#
# Le ratio 1 crawl / 2 timelines n'est pas un goût, c'est une soustraction : une
# passe de crawl CRÉE 120 matchs à timeliner, une passe de timeline en absorbe
# 80. À 1 pour 1 le retard se creuse — constaté le 2026-09-14, où il est monté de
# 1 007 à 1 367 en une matinée. À 1 pour 2 il se résorbe de 40 par cycle, et le
# jour où il atteint zéro les passes de timeline reviennent vides en une seconde.
# Auto-régulé, sans rien à régler.
name: Arena engine

on:
  schedule:
    # Deux tentatives par heure plutôt qu'une. Puisque GitHub échantillonne le
    # dépôt à intervalles irréguliers, doubler les entrées double les chances
    # qu'une tombe dans une fenêtre servie. Ça ne coûte rien : le groupe de
    # concurrence garantit qu'un seul moteur tourne à la fois.
    #
    # Ne pas s'attendre à ce que ces horaires soient tenus. Mesuré sur 28 h de
    # journal (13-14/09/2026), le planificateur n'a servi que 7 des ~28
    # déclenchements horaires attendus — 25 % — avec un trou de 7 h 47. C'est
    # documenté par GitHub comme « best-effort », et rien dans ce fichier ne le
    # corrige. La seule variable qu'on maîtrise, c'est ce qu'un déclenchement
    # SERVI parvient à couvrir : d'où MINUTES ci-dessous.
    #
    # 2026-09-28 : l'horloge principale est désormais pg_cron, dans Supabase,
    # qui envoie un workflow_dispatch à :09 (voir data-pipeline.md, « The clock
    # moves to the database »). Ce cron-ci reste en filet.
    - cron: "9,39 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Durée du moteur en minutes (max 330)"
        required: false
        default: "330"
      crawlMatches:
        description: "Matchs par passe de crawl"
        required: false
        default: "120"
      timelineMatches:
        description: "Matchs par passe de timeline"
        required: false
        default: "80"
      timelinePasses:
        description: "Passes de timeline par cycle (0 = crawl seul)"
        required: false
        default: "2"
      crawlPasses:
        description: "Passes de crawl par cycle (0 = timelines seules)"
        required: false
        default: "2"

# Un seul moteur à la fois. `cancel-in-progress: false` : un déclenchement qui
# tombe pendant un moteur en cours attend son tour au lieu de le tuer — c'est ce
# qui donne la couverture continue quand GitHub sert deux créneaux rapprochés.
concurrency:
  group: riot-api
  cancel-in-progress: false

# ─── LE CODE TOURNE ICI, PLUS SUR VERCEL (2026-10-05) ────────────────────────
#
# Jusqu'au 2 octobre, ce job ne faisait que des `curl` vers /api/cron/* : chaque
# passe tournait en fonction Vercel, et le compte Hobby a été bloqué pour usage
# excessif. Le runner exécute désormais lui-même scripts/jobs.ts — même code,
# même rythme (pauses et plafonds y sont repris à l'identique). Gratuit et sans
# limite de minutes sur un dépôt public.
jobs:
  engine:
    runs-on: ubuntu-latest
    # La limite dure de GitHub est de 360 min par job. La boucle s'arrête d'elle-
    # même sur MINUTES ; ce garde-fou ne sert que si une passe reste bloquée.
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Faire tourner le moteur
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          MINUTES: ${{ inputs.minutes || '330' }}
          CRAWL_MATCHES: ${{ inputs.crawlMatches || '120' }}
          TIMELINE_MATCHES: ${{ inputs.timelineMatches || '80' }}
          CRAWL_PASSES: ${{ inputs.crawlPasses || '2' }}
          TIMELINE_PASSES: ${{ inputs.timelinePasses || '2' }}
        run: npx tsx scripts/jobs.ts engine
